<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser votre inscription - MEDAIChain</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 600px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 24px;
            color: var(--text-primary);
        }

        .header p {
            color: var(--text-secondary);
            margin: 0;
        }

        .role-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="signup-container">
        <div class="header">
            <h1>Bienvenue sur MEDAIChain</h1>
            <p>Finalisez votre inscription pour accéder à la plateforme</p>
            <div id="role-badge" class="role-badge"></div>
        </div>

        <form id="signup-form">
            <div class="form-section">
                <h3><span class="material-icons-round">person</span> Informations personnelles</h3>
                <div class="form-row">
                    <div class="form-group" id="group-firstname">
                        <label>Prénom</label>
                        <input type="text" name="firstName" required>
                    </div>
                    <div class="form-group" id="group-lastname">
                        <label>Nom</label>
                        <input type="text" name="lastName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="tel" name="phone" required>
                    </div>
                </div>
            </div>

            <div id="role-specific-fields">
                <!-- Fields injected via JS -->
            </div>

            <div class="form-section">
                <h3><span class="material-icons-round">lock</span> Sécurité</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" name="password" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe</label>
                        <input type="password" name="confirmPassword" minlength="6" required>
                    </div>
                </div>
            </div>

            <div id="error-message" class="error-card" style="display: none; margin-bottom: 20px;">
                <div class="error-header">
                    <span class="material-icons-round error-icon">error_outline</span>
                    <h3 id="error-text">Erreur</h3>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">
                Confirmer l'inscription
            </button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const role = urlParams.get('role');
        const email = urlParams.get('email'); // Optional support if we pass it, but link currently doesn't have it explicitly in query in some flows, but auth.service link DOES NOT include it in token validation yet.
        // Wait, the previous tool call updated mail.service to include token and role. 
        // The email is NOT in the URL currently in mail.service.ts
        // Correct: `signup.html?token=${inviteToken}&role=${role}`
        // But backend `completeInvite` needs email.
        // PROBLEM: User clicking link doesn't provide email in URL.
        // SOLUTION: I must add email to the URL in mail.service.ts OR decode it from token if token was JWT (it's uuid).
        // QUICK FIX: I will update mail.service to include &email=... in the link.
        // For now, I will assume the user has to enter their email again OR I rely on the fact I should update mail.service.
    </script>
    <script src="signup.js"></script>
</body>

</html>
