<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - MEDAIChain</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background-color);
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(0, 255, 213, 0.2);
        }

        .logo-icon span {
            font-size: 32px;
            color: #000;
        }

        h1 {
            margin: 0 0 10px;
            color: var(--text-primary);
            font-size: 24px;
        }

        p {
            color: var(--text-secondary);
            margin: 0 0 30px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-icon">
            <span class="material-icons-round">admin_panel_settings</span>
        </div>
        <h1>Administration</h1>
        <p>Connectez-vous pour accéder au tableau de bord</p>

        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label>Email</label>
                <input type="email" name="email" required placeholder="admin@medaichain.com">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Mot de passe</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <div id="error-msg" class="error-text"
                style="display:none; color: #ff6b6b; margin-bottom: 15px; font-size: 14px;"></div>

            <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            const btn = e.target.querySelector('button');
            const errorDiv = document.getElementById('error-msg');

            btn.disabled = true;
            btn.textContent = 'Connexion...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.message || 'Échec de la connexion');

                // Store token
                const role = data.user.role;
                localStorage.setItem('token', data.accessToken);
                localStorage.setItem('role', role);

                // Compatibility with admin dashboard
                if (role === 'admin') {
                    localStorage.setItem('admin_token', data.accessToken);
                }

                // Redirect based on role
                if (role === 'admin') {
                    window.location.href = '/';
                } else if (role === 'medecin') {
                    window.location.href = '/doctor_dashboard.html';
                } else if (role === 'clinique') {
                    window.location.href = '/clinique_dashboard.html';
                } else {
                    window.location.href = '/';
                }

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        });
    </script>

</body>

</html>
